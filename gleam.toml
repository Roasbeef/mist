name = "mist"
version = "6.0.3"

licences = ["Apache-2.0"]
description = "a misty Gleam web server"
repository = { type = "github", user = "rawhat", repo = "mist" }
target = "erlang"
gleam = ">= 1.11.0"

[erlang]
application_start_module = "mist@internal@clock"

[dependencies]
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
hpack_erl = ">= 0.3.0 and < 1.0.0"
logging = ">= 1.0.0 and < 2.0.0"
glisten = { git = "https://github.com/Roasbeef/glisten.git", ref = "3eb785919be0736da0a20732a56275dce0132327" }
exception = ">= 2.1.0 and < 3.0.0"
gramps = { git = "https://github.com/Roasbeef/gramps.git", ref = "a37a8ae3fe2531375b49b865c155eb2987d4d22a" }
gleam_otp = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_hackney = ">= 1.2.0 and < 2.0.0"
